name: CFD 1R Range Backtest
on:
  push:
    paths:
      - '.github/workflows/cfd_1r_range_backtest.yml'
jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate 1R strategy
        shell: bash
        run: |
          cat > /tmp/calc.py <<'PY'
          import json,time
          from datetime import datetime,date,timezone
          from urllib.request import Request,urlopen

          BASE='https://jetta.dukascopy.com/v1'
          TARGETS=[
            ('2026-08-27','日本225','JPN.IDX-JPY','LONG'),
            ('2026-08-27','NQ100','USATECH.IDX-USD','SHORT'),
            ('2026-08-31','日本225','JPN.IDX-JPY','SHORT'),
            ('2026-08-31','NQ100','USATECH.IDX-USD','SHORT'),
            ('2026-09-01','日本225','JPN.IDX-JPY','SHORT'),
            ('2026-09-01','NQ100','USATECH.IDX-USD','SHORT'),
            ('2026-09-02','日本225','JPN.IDX-JPY','SHORT'),
            ('2026-09-02','NQ100','USATECH.IDX-USD','SHORT'),
            ('2026-09-03','日本225','JPN.IDX-JPY','SHORT'),
          ]

          def fetch_json(url):
            last=None
            for attempt in range(4):
              try:
                req=Request(url,headers={'User-Agent':'Mozilla/5.0 CFD-1R-audit'})
                with urlopen(req,timeout=40) as r: return json.loads(r.read().decode())
              except Exception as e:
                last=e; time.sleep(2*(attempt+1))
            raise RuntimeError(f'{url}: {last}')

          def get_day(code,side,day_str):
            d=date.fromisoformat(day_str)
            urls=[f'{BASE}/candles/minute/{code}/{side}/{d.year}/{d.month}/{d.day}',
                  f'{BASE}/candles/minute/{code}/{side}?from={int(datetime(d.year,d.month,d.day,tzinfo=timezone.utc).timestamp()*1000)}']
            for u in urls:
              try:
                o=fetch_json(u)
                if isinstance(o,dict) and o.get('times'): return o
              except: pass
            raise RuntimeError('no data '+str((code,side,day_str)))

          def digits(mult):
            s=f'{mult:.12f}'.rstrip('0')
            return len(s.split('.')[1]) if '.' in s else 0

          def normalise(o):
            mult=float(o['multiplier']); dg=digits(mult); shift=int(o['shift']); ts=int(o['timestamp'])
            ou=round(float(o['open'])/mult); hu=round(float(o['high'])/mult); lu=round(float(o['low'])/mult); cu=round(float(o['close'])/mult); prev=cu
            rows=[]
            p=lambda u: round(u*mult,dg)
            for i,delta0 in enumerate(o['times']):
              delta=int(delta0); gap_count=delta-(0 if i==0 else 1)
              for gap in range(max(0,gap_count)):
                flat_ts=ts+(gap if i==0 else gap+1)*shift; px=p(prev)
                rows.append({'ts':flat_ts,'open':px,'high':px,'low':px,'close':px})
              ts += delta*shift
              ou+=int(o['opens'][i]); hu+=int(o['highs'][i]); lu+=int(o['lows'][i]); cu+=int(o['closes'][i]); prev=cu
              rows.append({'ts':ts,'open':p(ou),'high':p(hu),'low':p(lu),'close':p(cu)})
            return {r['ts']:r for r in rows}

          def session(market,ds):
            d=date.fromisoformat(ds)
            if market=='日本225':
              op=datetime(d.year,d.month,d.day,0,0,tzinfo=timezone.utc); cutoff=datetime(d.year,d.month,d.day,6,30,tzinfo=timezone.utc)
            else:
              op=datetime(d.year,d.month,d.day,13,30,tzinfo=timezone.utc); cutoff=datetime(d.year,d.month,d.day,20,0,tzinfo=timezone.utc)
            return int(op.timestamp()*1000),int(cutoff.timestamp()*1000)

          cache={}
          for ds,m,c,direction in TARGETS:
            for side in ('BID','ASK'):
              k=(ds,c,side)
              if k not in cache: cache[k]=normalise(get_day(c,side,ds))

          results=[]
          for ds,m,c,direction in TARGETS:
            bid=cache[(ds,c,'BID')]; ask=cache[(ds,c,'ASK')]
            op,cutoff=session(m,ds); initial=[op+i*60000 for i in range(15)]
            exitmap=bid if direction=='LONG' else ask
            entry=ask[op]['open'] if direction=='LONG' else bid[op]['open']
            hi=max(exitmap[t]['high'] for t in initial); lo=min(exitmap[t]['low'] for t in initial); width=hi-lo
            tp_level=hi+width if direction=='LONG' else lo-width
            reason=None; trigger=None; fill=None; exit_px=None
            for t in range(op+15*60000,cutoff,60000):
              r=exitmap[t]
              tp=(r['high']>=tp_level) if direction=='LONG' else (r['low']<=tp_level)
              sl=(r['close']<lo) if direction=='LONG' else (r['close']>hi)
              # If both are somehow true in one minute, use conservative SL-first.
              if sl:
                nt=t+60000
                rr=exitmap[nt] if nt<cutoff else r
                exit_px=rr['open'] if nt<cutoff else r['close']; reason='SL'; trigger=t; fill=nt if nt<cutoff else t; break
              if tp:
                exit_px=tp_level; reason='TP'; trigger=t; fill=t; break
            if reason is None:
              t=cutoff-60000; exit_px=exitmap[t]['close']; reason='TIME'; trigger=fill=t
            pnl=(exit_px-entry) if direction=='LONG' else (entry-exit_px)
            iso=lambda t: datetime.fromtimestamp(t/1000,timezone.utc).isoformat().replace('+00:00','Z')
            results.append({'date':ds,'market':m,'direction':direction,'entry':entry,'range_high':hi,'range_low':lo,'range_width':round(width,6),'tp_level':round(tp_level,6),'exit_reason':reason,'trigger_utc':iso(trigger),'fill_utc':iso(fill),'exit':exit_px,'pnl_points':round(pnl,6)})

          def summary(rs):
            vals=[r['pnl_points'] for r in rs]
            return {'trades':len(vals),'wins':sum(v>0 for v in vals),'losses':sum(v<0 for v in vals),'win_rate_pct':round(100*sum(v>0 for v in vals)/len(vals),2),'total_points':round(sum(vals),6),'avg_points':round(sum(vals)/len(vals),6),'tp':sum(r['exit_reason']=='TP' for r in rs),'sl':sum(r['exit_reason']=='SL' for r in rs),'time':sum(r['exit_reason']=='TIME' for r in rs)}

          out={'results':results,'summary_all':summary(results),'summary_ex_0827':summary([r for r in results if r['date']!='2026-08-27'])}
          for label,rs in [('all',results),('ex_0827',[r for r in results if r['date']!='2026-08-27'])]:
            out['by_market_'+label]={m:summary([r for r in rs if r['market']==m]) for m in ('日本225','NQ100') if any(r['market']==m for r in rs)}
          print('RESULT_JSON_START')
          print(json.dumps(out,ensure_ascii=False,separators=(',',':')))
          print('RESULT_JSON_END')
          PY
          python /tmp/calc.py
