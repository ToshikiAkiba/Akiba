name: Temporary CFD BidAsk Backtest

on:
  push:
    paths:
      - '.github/workflows/cfd_bidask_backtest.yml'

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Dukascopy Bid Ask and calculate
        shell: bash
        run: |
          cat > /tmp/calc.py <<'PY'
          import csv, json, math, time
          from datetime import datetime, date, timedelta, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          BASE = 'https://jetta.dukascopy.com/v1'
          TARGETS = [
              ('2026-08-27','日本225','JPN.IDX-JPY','LONG'),
              ('2026-08-27','NQ100','USATECH.IDX-USD','SHORT'),
              ('2026-08-31','日本225','JPN.IDX-JPY','SHORT'),
              ('2026-08-31','NQ100','USATECH.IDX-USD','SHORT'),
              ('2026-09-01','日本225','JPN.IDX-JPY','SHORT'),
              ('2026-09-01','NQ100','USATECH.IDX-USD','SHORT'),
              ('2026-09-02','日本225','JPN.IDX-JPY','SHORT'),
              ('2026-09-02','NQ100','USATECH.IDX-USD','SHORT'),
              ('2026-09-03','日本225','JPN.IDX-JPY','SHORT'),
          ]

          def fetch_json(url):
              last = None
              for attempt in range(4):
                  try:
                      req = Request(url, headers={'User-Agent':'Mozilla/5.0 CFD-backtest-audit'})
                      with urlopen(req, timeout=40) as r:
                          raw = r.read()
                      return json.loads(raw.decode('utf-8')), len(raw)
                  except Exception as e:
                      last = repr(e)
                      time.sleep(2 * (attempt + 1))
              raise RuntimeError(f'fetch failed {url}: {last}')

          def get_day(code, side, day_str):
              d = date.fromisoformat(day_str)
              path = f'{BASE}/candles/minute/{code}/{side}/{d.year}/{d.month}/{d.day}'
              urls = [path]
              start_ms = int(datetime(d.year,d.month,d.day,tzinfo=timezone.utc).timestamp()*1000)
              urls.append(f'{BASE}/candles/minute/{code}/{side}?from={start_ms}')
              errs=[]
              for url in urls:
                  try:
                      obj, nbytes = fetch_json(url)
                      if isinstance(obj, dict) and isinstance(obj.get('times'), list) and obj.get('times'):
                          return obj, url, nbytes
                      errs.append(f'empty:{url}')
                  except Exception as e:
                      errs.append(str(e))
              raise RuntimeError(' | '.join(errs))

          def scale_digits(multiplier):
              s = f'{multiplier:.12f}'.rstrip('0')
              return len(s.split('.')[1]) if '.' in s else 0

          def normalise(obj):
              n = len(obj['times'])
              cols = ['opens','highs','lows','closes','volumes']
              for c in cols:
                  if len(obj.get(c,[])) != n:
                      raise ValueError(f'column length mismatch {c}')
              mult=float(obj['multiplier']); shift=int(obj['shift'])
              digits=scale_digits(mult)
              ts=int(obj['timestamp'])
              ou=round(float(obj['open'])/mult); hu=round(float(obj['high'])/mult)
              lu=round(float(obj['low'])/mult); cu=round(float(obj['close'])/mult)
              prev_cu=cu
              rows=[]
              def p(u): return round(u*mult,digits)
              for i in range(n):
                  delta=int(obj['times'][i])
                  gap_count=delta-(0 if i==0 else 1)
                  for gap in range(max(0,gap_count)):
                      flat_ts=ts+(gap if i==0 else gap+1)*shift
                      px=p(prev_cu)
                      rows.append({'ts':flat_ts,'open':px,'high':px,'low':px,'close':px,'flat':True})
                  ts += delta*shift
                  ou += int(obj['opens'][i]); hu += int(obj['highs'][i]); lu += int(obj['lows'][i]); cu += int(obj['closes'][i])
                  prev_cu=cu
                  rows.append({'ts':ts,'open':p(ou),'high':p(hu),'low':p(lu),'close':p(cu),'flat':False})
              return rows

          def to_map(rows):
              return {r['ts']:r for r in rows}

          def session_params(market, day_str):
              d=date.fromisoformat(day_str)
              if market=='日本225':
                  open_dt=datetime(d.year,d.month,d.day,0,0,tzinfo=timezone.utc)
                  cutoff=datetime(d.year,d.month,d.day,6,30,tzinfo=timezone.utc)
              else:
                  open_dt=datetime(d.year,d.month,d.day,13,30,tzinfo=timezone.utc)
                  cutoff=datetime(d.year,d.month,d.day,20,0,tzinfo=timezone.utc)
              return int(open_dt.timestamp()*1000), int(cutoff.timestamp()*1000)

          def row_at(mp, ts, label):
              if ts not in mp:
                  near=sorted(mp)
                  before=[x for x in near if x<=ts]
                  after=[x for x in near if x>=ts]
                  raise KeyError(f'{label} missing {datetime.fromtimestamp(ts/1000,timezone.utc)} near {before[-1:]}/{after[:1]}')
              return mp[ts]

          cache={}; meta=[]
          for day_str,market,code,direction in TARGETS:
              for side in ('BID','ASK'):
                  key=(day_str,code,side)
                  if key not in cache:
                      obj,url,nbytes=get_day(code,side,day_str)
                      rows=normalise(obj)
                      cache[key]=to_map(rows)
                      meta.append({'date':day_str,'code':code,'side':side,'url':url,'bytes':nbytes,'rows':len(rows),'first_ts':rows[0]['ts'],'last_ts':rows[-1]['ts']})

          results=[]
          minute_audit=[]
          for day_str,market,code,direction in TARGETS:
              bid=cache[(day_str,code,'BID')]; ask=cache[(day_str,code,'ASK')]
              open_ts, cutoff_ts=session_params(market,day_str)
              end15_ts=open_ts+14*60_000
              br0=row_at(bid,open_ts,'bid open'); ar0=row_at(ask,open_ts,'ask open')
              br14=row_at(bid,end15_ts,'bid 15m end'); ar14=row_at(ask,end15_ts,'ask 15m end')
              if direction=='LONG':
                  s1_entry=ar0['open']; s1_exit=br14['close']; s1_pnl=s1_exit-s1_entry
                  exit_map=bid
              else:
                  s1_entry=br0['open']; s1_exit=ar14['close']; s1_pnl=s1_entry-s1_exit
                  exit_map=ask

              init_ts=[open_ts+i*60_000 for i in range(15)]
              init=[row_at(exit_map,t,'range') for t in init_ts]
              rng_high=max(r['high'] for r in init); rng_low=min(r['low'] for r in init)
              entry=s1_entry
              exit_reason=None; trigger_ts=None; fill_ts=None; exit_px=None; both=False
              scan_ts=list(range(open_ts+15*60_000,cutoff_ts,60_000))
              for idx,t in enumerate(scan_ts):
                  r=row_at(exit_map,t,'scan')
                  if direction=='LONG':
                      tp=(r['high']>=rng_high)
                      sl=(r['close']<rng_low)
                  else:
                      tp=(r['low']<=rng_low)
                      sl=(r['close']>rng_high)
                  if tp and sl:
                      both=True
                      sl=True; tp=False
                  if sl:
                      trigger_ts=t
                      nt=t+60_000
                      nr=row_at(exit_map,nt,'next-open fill') if nt<cutoff_ts else r
                      exit_px=nr['open'] if nt<cutoff_ts else r['close']
                      fill_ts=nt if nt<cutoff_ts else t
                      exit_reason='SL'
                      break
                  if tp:
                      trigger_ts=t; fill_ts=t
                      exit_px=rng_high if direction=='LONG' else rng_low
                      exit_reason='TP'
                      break
              if exit_reason is None:
                  last_ts=cutoff_ts-60_000
                  lr=row_at(exit_map,last_ts,'time exit')
                  exit_px=lr['close']; trigger_ts=last_ts; fill_ts=last_ts; exit_reason='TIME'
              s2_pnl=(exit_px-entry) if direction=='LONG' else (entry-exit_px)
              def iso(ts): return datetime.fromtimestamp(ts/1000,timezone.utc).isoformat().replace('+00:00','Z')
              results.append({
                  'date':day_str,'market':market,'code':code,'direction':direction,
                  'strategy1':{'entry_price':s1_entry,'entry_side':'ASK' if direction=='LONG' else 'BID','exit_price':s1_exit,'exit_side':'BID' if direction=='LONG' else 'ASK','exit_time_utc':iso(end15_ts+60_000),'pnl_points':round(s1_pnl,6)},
                  'strategy2':{'entry_price':entry,'entry_side':'ASK' if direction=='LONG' else 'BID','range_price_side':'BID' if direction=='LONG' else 'ASK','range_high':rng_high,'range_low':rng_low,'exit_reason':exit_reason,'trigger_time_utc':iso(trigger_ts),'fill_time_utc':iso(fill_ts),'exit_price':exit_px,'exit_side':'BID' if direction=='LONG' else 'ASK','pnl_points':round(s2_pnl,6),'same_minute_both_conservative_sl':both},
                  'audit_15m':{'bid_open':br0['open'],'bid_close':br14['close'],'ask_open':ar0['open'],'ask_close':ar14['close'],'bid_high':max(row_at(bid,t,'b') ['high'] for t in init_ts),'bid_low':min(row_at(bid,t,'b')['low'] for t in init_ts),'ask_high':max(row_at(ask,t,'a')['high'] for t in init_ts),'ask_low':min(row_at(ask,t,'a')['low'] for t in init_ts)}
              })
              for t in init_ts:
                  b=row_at(bid,t,'b'); a=row_at(ask,t,'a')
                  minute_audit.append([day_str,market,iso(t),b['open'],b['high'],b['low'],b['close'],a['open'],a['high'],a['low'],a['close']])

          def aggregate(strategy):
              out={}
              for r in results:
                  for key in ('全体',r['market']):
                      out.setdefault(key,[]).append(r[strategy]['pnl_points'])
              return {k:{'trades':len(v),'wins':sum(x>0 for x in v),'losses':sum(x<0 for x in v),'flat':sum(x==0 for x in v),'win_rate_pct':round(100*sum(x>0 for x in v)/len(v),2),'total_points':round(sum(v),6),'average_points':round(sum(v)/len(v),6)} for k,v in out.items()}

          output={'source':'Dukascopy Jetta Bid/Ask minute candles (SBI CFD proxy; not official SBI quotes)','rules':{'s1':'LONG Ask-open to Bid-close; SHORT Bid-open to Ask-close, first 15 minutes','s2':'entry at open; range is first 15m on executable exit side; evaluate from minute 16; TP at direction-side range edge on touch; SL after 1m close beyond opposite edge, filled next minute open; same-minute ambiguity SL-first; time exit JP 15:30 JST / NQ 16:00 ET'},'results':results,'summary_strategy1':aggregate('strategy1'),'summary_strategy2':aggregate('strategy2'),'fetch_meta':meta}
          with open('results.json','w',encoding='utf-8') as f: json.dump(output,f,ensure_ascii=False,indent=2)
          with open('initial_15m_bidask.csv','w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f); w.writerow(['date','market','minute_utc','bid_o','bid_h','bid_l','bid_c','ask_o','ask_h','ask_l','ask_c']); w.writerows(minute_audit)
          print('RESULT_JSON_START')
          print(json.dumps(output,ensure_ascii=False,separators=(',',':')))
          print('RESULT_JSON_END')
          PY
          python /tmp/calc.py
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfd-bidask-backtest-results
          path: |
            results.json
            initial_15m_bidask.csv
          retention-days: 1
